location ${NGINX_PROXY_BACKEND_LOCATION} {
  proxy_pass            "${NGINX_PROXY_BACKEND_PROXY_PASS}";
  proxy_http_version    1.1;
  proxy_cache_bypass    $http_upgrade;

  add_header "Access-Control-Allow-Origin" "*" always;
  add_header "Access-Control-Allow-Credentials" "true" always;
  add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS" always;
  add_header "Access-Control-Allow-Headers" "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With" always;

  proxy_ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
  proxy_ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

  proxy_set_header X-SSL-I-DN        $ssl_client_i_dn;
  proxy_set_header X-SSL-S-DN        $ssl_client_s_dn;
  proxy_set_header X-SSL-SERIAL      $ssl_client_serial;

  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;
}